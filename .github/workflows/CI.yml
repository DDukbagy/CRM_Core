name: CI (Tests)

on:
  push:
    branches: ["**"]  # 모든 브랜치 푸시 시 테스트 실행 (작업 브랜치 포함)
  pull_request:
    branches: ["main", "staging"]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pipx install poetry

      - name: Install dependencies
        run: poetry install --no-interaction

      # DB 마이그레이션 적용 (SSL 비활성화 환경변수 적용)
      - name: Initialize Database (Alembic)
        env:
          PYTHONPATH: .
          PGSSLMODE: disable
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/postgres?ssl=disable
          AWS_ACCESS_KEY_ID: testing
          AWS_SECRET_ACCESS_KEY: testing
          AWS_SECURITY_TOKEN: testing
          AWS_SESSION_TOKEN: testing
          AWS_DEFAULT_REGION: ap-northeast-2
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_ANON_KEY: dummy
          SUPABASE_JWT_SECRET: dummy
        run: poetry run alembic upgrade head

      # 테스트 실행
      - name: Run tests
        env:
          PYTHONPATH: .
          PGSSLMODE: disable
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/postgres?ssl=disable
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_ANON_KEY: dummy
          SUPABASE_JWT_SECRET: dummy
          AWS_ACCESS_KEY_ID: testing
          AWS_SECRET_ACCESS_KEY: testing
          AWS_SECURITY_TOKEN: testing
          AWS_SESSION_TOKEN: testing
          AWS_DEFAULT_REGION: ap-northeast-2
        run: poetry run pytest -q