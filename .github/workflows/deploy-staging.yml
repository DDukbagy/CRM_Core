name: Deploy Staging

# 제목: Deploy Staging | push | staging
run-name: 🚀 Deploy Staging | ${{ github.event_name }} | ${{ github.ref_name }}

on:
  push:
    branches: [staging] # Merge(Push) 완료되면 이 파일 하나만 실행됨
  workflow_dispatch:

permissions:
  id-token: write
  contents: write
  pull-requests: write

jobs:
  # [1단계] Backend CI 불러오기 (참조)
  backend-check:
    uses: ./.github/workflows/backend-CI.yml
    secrets: inherit

  # [1단계] Frontend CI 불러오기 (참조)
  frontend-check:
    uses: ./.github/workflows/frontend-CI.yml
    secrets: inherit

  # [2단계] 배포 (위의 두 검사가 끝나야 실행됨)
  deploy:
    needs: [backend-check, frontend-check] # 👈 순차 실행의 핵심 (Merge Done -> CI -> Deploy)
    name: 🚀 Deploy (Staging)
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 디버깅
      - name: 🔍 Debug OIDC Context (로그 확인용)
        run: |
          echo "=========================================="
          echo "GitHub가 AWS에 보낼 정보(Claims) 미리보기"
          echo "------------------------------------------"
          echo "1. Repository (repo): ${{ github.repository }}"
          echo "2. Ref (ref): ${{ github.ref }}"
          echo "3. Actor (actor): ${{ github.actor }}"
          echo "4. Event (event_name): ${{ github.event_name }}"
          echo "5. Workflow (workflow): ${{ github.workflow }}"
          echo "=========================================="
          echo "만약 위 정보와 AWS 신뢰 정책이 글자 하나라도 다르면 실패합니다."
        shell: bash

      # AWS 인증
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_STAGING }}
          aws-region: ap-northeast-2

      - name: Install AWS Copilot
        run: |
          curl -Lo copilot-linux https://github.com/aws/copilot-cli/releases/latest/download/copilot-linux
          chmod +x copilot-linux
          mkdir -p ~/.local/bin
          mv copilot-linux ~/.local/bin/copilot
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      # Staging 배포 실행
      - name: Copilot Deploy
        run: copilot svc deploy --name api --env staging --detach
        working-directory: ./backend

      # 배포 성공 시 Staging -> Main PR 자동 생성
      - name: Create Pull Request to Main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --base main \
            --head staging \
            --title "🚀 Release: Staging to Main" \
            --body "Staging 환경 배포 및 테스트가 완료되었습니다. Main으로 병합을 요청합니다." \
            || echo "PR already exists"