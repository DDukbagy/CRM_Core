name: Deploy Staging

# 제목: Deploy Staging | push | staging
run-name: 🚀 Deploy Staging | ${{ github.event_name }} | ${{ github.ref_name }}

on:
  push:
    branches: [staging] # Merge(Push) 완료되면 이 파일 하나만 실행됨
  workflow_dispatch:

permissions:
  id-token: write
  contents: write
  pull-requests: write

jobs:
  root-check:
    name: 🔍 Global Linter / Config Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Root Scripts or Linters
        run: |
          echo "루트 설정 파일(Makefile, 환경변수 등)의 형식을 검사합니다."
          # 여기에 전체 프로젝트 공통 검사 로직이 있다면 추가 (없으면 생략 가능)

  # Backend CI 참조
  backend-check:
    uses: ./.github/workflows/backend-CI.yml
    secrets: inherit

  # Frontend CI 참조
  frontend-check:
    uses: ./.github/workflows/frontend-CI.yml
    secrets: inherit

  # 배포
  deploy:
    needs: [root-check, backend-check, frontend-check]
    name: 🚀 Deploy (Staging)
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 디버깅
      - name: 🔍 Debug OIDC Context (로그 확인용)
        run: |
          echo "=========================================="
          echo "GitHub가 AWS에 보낼 정보(Claims) 미리보기"
          echo "------------------------------------------"
          echo "1. Repository (repo): ${{ github.repository }}"
          echo "2. Ref (ref): ${{ github.ref }}"
          echo "3. Actor (actor): ${{ github.actor }}"
          echo "4. Event (event_name): ${{ github.event_name }}"
          echo "5. Workflow (workflow): ${{ github.workflow }}"
          echo "=========================================="
          echo "만약 위 정보와 AWS 신뢰 정책이 글자 하나라도 다르면 실패합니다."
        shell: bash

      # AWS 인증
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_STAGING }}
          aws-region: ap-northeast-2

      - name: Install AWS Copilot
        run: |
          curl -Lo copilot-linux https://github.com/aws/copilot-cli/releases/latest/download/copilot-linux
          chmod +x copilot-linux
          mkdir -p ~/.local/bin
          mv copilot-linux ~/.local/bin/copilot
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      # Staging 배포 실행
      - name: Copilot Deploy
        run: copilot svc deploy --name api --env staging --detach
        working-directory: ./backend

      - name: Create Pull Request to Main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --base main \
            --head staging \
            --title "🚀 Release: Staging to Main" \
            --body "Staging 환경 배포 및 테스트가 완료되었습니다. Main으로 병합을 요청합니다." \
            || echo "PR already exists"

  # 작업브랜치 동기화 (deploy 성공/실패 무관하게 항상 실행)
  sync:
    name: 🔄 Sync source branch with staging
    needs: [backend-check, frontend-check]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync source branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SOURCE_BRANCH=$(gh pr list --base staging --state merged --limit 1 --json headRefName --jq '.[0].headRefName')
          echo "Source branch: $SOURCE_BRANCH"

          if [ -z "$SOURCE_BRANCH" ] || [ "$SOURCE_BRANCH" = "main" ] || [ "$SOURCE_BRANCH" = "staging" ]; then
            echo "No feature branch to sync, skipping."
            exit 0
          fi

          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git fetch origin
          git checkout "$SOURCE_BRANCH"
          git merge origin/staging --no-edit
          git push origin "$SOURCE_BRANCH"
