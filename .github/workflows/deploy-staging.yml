name: Deploy Staging

on:
  push:
    branches: ["staging"]  # staging 브랜치 변경 시에만 실행 (권한 문제 해결)

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-staging-${{ github.sha }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy (staging)
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # staging 브랜치는 AWS IAM에서 허용해주어야 함
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Install AWS Copilot
        run: |
          curl -Lo copilot-cli https://github.com/aws/copilot-cli/releases/latest/download/copilot-linux
          chmod +x copilot-cli
          mkdir -p ~/.local/bin
          mv copilot-cli ~/.local/bin/copilot
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Deploy (staging)
        run: copilot svc deploy --name api --env staging

      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Resolve staging URL
        id: staging_url
        run: |
          set -euo pipefail
          ENV_NAME="staging"
          STAGING_URL=$(
            copilot svc show --name api --json \
            | jq -r --arg env "$ENV_NAME" '.routes[] | select(.environment==$env) | .url' \
            | head -n 1
          )
          
          if [ -z "$STAGING_URL" ] || [ "$STAGING_URL" = "null" ]; then
            echo "ERROR: Failed to resolve staging URL"
            exit 1
          fi

          echo "STAGING_URL=$STAGING_URL" >> "$GITHUB_OUTPUT"
          echo "Staging URL: $STAGING_URL"

      - name: Smoke test (staging)
        run: |
          URL="${{ steps.staging_url.outputs.STAGING_URL }}"
          echo "Checking $URL/health/ready"
          
          # Retry loop (max 90s)
          for i in {1..18}; do
            if curl -fsS "$URL/health/ready" > /dev/null; then
              echo "OK: Ready"
              exit 0
            fi
            echo "Waiting... ($i/18)"
            sleep 5
          done
          echo "ERROR: Service not ready"
          exit 1