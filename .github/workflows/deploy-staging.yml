name: Deploy Staging

# 제목: Deploy Staging | workflow_run | staging
run-name: 🚀 Deploy Staging | ${{ github.event_name }} | ${{ github.event.workflow_run.head_branch }}

on:
  workflow_run:
    workflows: ["Backend CI"] # CI.yml의 name과 일치해야 함
    types:
      - completed

permissions:
  id-token: write
  contents: write  # PR 생성을 위해 write 권한 필요
  pull-requests: write # PR 생성을 위해 필수

jobs:
  deploy:
    # CI가 성공했고, 그 CI가 'staging' 브랜치에서 실행됐을 때만 배포
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'staging' }}
    name: 🚀 Deploy (Staging)
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: staging # workflow_run은 기본 브랜치를 가져오므로 명시적으로 staging 체크아웃

      # AWS 인증
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ap-northeast-2

      - name: Install AWS Copilot
        run: |
          curl -Lo copilot-linux https://github.com/aws/copilot-cli/releases/latest/download/copilot-linux
          chmod +x copilot-linux
          mkdir -p ~/.local/bin
          mv copilot-linux ~/.local/bin/copilot
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      # Staging 배포 실행
      - name: Copilot Deploy
        run: copilot svc deploy --name api --env staging --detach

      # 배포 성공 시 Staging -> Main PR 자동 생성
      - name: Create Pull Request to Main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --base main \
            --head staging \
            --title "🚀 Release: Staging to Main" \
            --body "Staging 환경 배포 및 테스트가 완료되었습니다. Main으로 병합을 요청합니다." \
            || echo "PR already exists"