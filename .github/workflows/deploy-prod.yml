name: Deploy Prod

# 제목: Deploy Prod | push | main
run-name: 🚀 Deploy Prod | ${{ github.event_name }} | ${{ github.ref_name }}

on:
  push:
    branches: [main] # Merge(Push) 완료되면 이 파일 하나만 실행됨
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  # root check
  root-check:
    name: 🔍 Global Linter / Config Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Root Scripts or Linters
        run: |
          echo "루트 설정 파일(Makefile, 환경변수 등)의 형식을 검사합니다."
          # 여기에 전체 프로젝트 공통 검사 로직이 있다면 추가 (없으면 생략 가능)

  # Backend CI 참조
  backend-check:
    uses: ./.github/workflows/backend-CI.yml
    secrets: inherit

  # Frontend CI 참조
  frontend-check:
    uses: ./.github/workflows/frontend-CI.yml
    secrets: inherit

  # 배포
  deploy:
    needs: [root-check, backend-check, frontend-check] 
    name: 🚀 Deploy (Prod)
    runs-on: ubuntu-latest
    environment: prod # GitHub Environment 보호 규칙 적용

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        # Main 브랜치 코드 자동 체크아웃

      # 디버깅
      - name: 🔍 Debug OIDC Context (로그 확인용)
        run: |
          echo "=========================================="
          echo "GitHub가 AWS에 보낼 정보(Claims) 미리보기"
          echo "------------------------------------------"
          echo "1. Repository (repo): ${{ github.repository }}"
          echo "2. Ref (ref): ${{ github.ref }}"
          echo "3. Actor (actor): ${{ github.actor }}"
          echo "4. Event (event_name): ${{ github.event_name }}"
          echo "5. Workflow (workflow): ${{ github.workflow }}"
          echo "=========================================="
          echo "만약 위 정보와 AWS 신뢰 정책이 글자 하나라도 다르면 실패합니다."
        shell: bash

      # AWS 인증
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_PROD }}
          aws-region: ap-northeast-2

      - name: Install AWS Copilot
        run: |
          curl -Lo copilot-linux https://github.com/aws/copilot-cli/releases/latest/download/copilot-linux
          chmod +x copilot-linux
          mkdir -p ~/.local/bin
          mv copilot-linux ~/.local/bin/copilot
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      # Prod 배포 실행
      - name: Copilot Deploy
        run: copilot svc deploy --name api --env prod --detach
        working-directory: ./backend