name: Deploy Prod

# 제목: Deploy Prod | workflow_run | main
run-name: 🚀 Deploy Prod | ${{ github.event_name }} | ${{ github.event.workflow_run.head_branch }}

on:
  workflow_run:
    workflows: ["Backend CI"]
    types:
      - completed

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    # CI 성공 AND 브랜치가 main 일 때만 실행
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    name: 🚀 Deploy (Prod)
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ap-northeast-2

      - name: Install AWS Copilot
        run: |
          curl -Lo copilot-linux https://github.com/aws/copilot-cli/releases/latest/download/copilot-linux
          chmod +x copilot-linux
          mkdir -p ~/.local/bin
          mv copilot-linux ~/.local/bin/copilot
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Copilot Deploy
        run: copilot svc deploy --name api --env prod --detach