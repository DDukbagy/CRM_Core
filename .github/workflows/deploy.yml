name: Deploy

on:
  # 1) CI가 성공하면(=main push에 대한 CI 완료) staging 자동배포
  workflow_run:
    workflows: ["CI"]     # CI workflow 이름과 동일
    types: [completed]
    branches: [main]

  # 2) 태그(v*)를 푸시하면 prod 배포 (승인 대체)
  push:
    tags:
      - "v*"

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-staging:
    name: Deploy (staging)
    if: >
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Install AWS Copilot
        run: |
          curl -Lo copilot-cli https://github.com/aws/copilot-cli/releases/latest/download/copilot-linux
          chmod +x copilot-cli
          mkdir -p ~/.local/bin
          mv copilot-cli ~/.local/bin/copilot
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          copilot --version

      - name: Deploy (staging)
        run: copilot svc deploy --name api --env staging

      - name: Install jq (for parsing copilot json)
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Resolve staging URL
        id: staging_url
        run: |
          # copilot svc show --json에서 첫 번째 route url을 가져온다.
          STAGING_URL=$(copilot svc show --name api --env staging --json | jq -r '.routes[0].url')
          if [ -z "$STAGING_URL" ] || [ "$STAGING_URL" = "null" ]; then
            echo "ERROR: Failed to resolve staging URL from copilot svc show"
            exit 1
          fi
          echo "STAGING_URL=$STAGING_URL" >> "$GITHUB_OUTPUT"
          echo "Staging URL: $STAGING_URL"

      - name: Wait for service to be ready
        run: |
          # 배포 직후 ALB/타겟그룹 안정화 시간 약간 기다림
          sleep 10

      - name: Smoke test (staging) - /health must be 200
        run: |
          set -euo pipefail
          URL="${{ steps.staging_url.outputs.STAGING_URL }}"
          echo "GET $URL/health"
          # -f: 4xx/5xx면 실패 처리
          curl -fS "$URL/health"

      - name: Rehearsal check (staging) - /docs reachable (FastAPI)
        run: |
          set -euo pipefail
          URL="${{ steps.staging_url.outputs.STAGING_URL }}"
          echo "GET $URL/docs"
          curl -fS "$URL/docs" > /dev/null

      # (선택) DB/외부 연결까지 확인하는 readiness 엔드포인트가 있다면 여기서 켜기
      # - name: Rehearsal check (staging) - /health/ready (DB + deps)
      #   run: |
      #     set -euo pipefail
      #     URL="${{ steps.staging_url.outputs.STAGING_URL }}"
      #     echo "GET $URL/health/ready"
      #     curl -fS "$URL/health/ready"

      # (선택) 너의 핵심 기능 API 1개를 호출해서 리허설 수준 확인
      # 예: 인증/프로필/간단 조회 등 (토큰 필요하면 github secrets에서 토큰 받아서 헤더 붙이기)
      # - name: Rehearsal check (staging) - core API call
      #   run: |
      #     set -euo pipefail
      #     URL="${{ steps.staging_url.outputs.STAGING_URL }}"
      #     curl -fS "$URL/api/v1/some-endpoint"


  deploy-prod:
    name: Deploy (prod)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # environment: prod   # (선택) environment secrets/vars 쓸 때만 켜. 켜면 prod env에서 tags(v*) 허용 필요.

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure tag commit is contained in main
        shell: bash
        run: |
          set -euo pipefail

          # Make sure we have enough history for ancestry checks.
          git fetch --no-tags origin main

          TAG_SHA="$(git rev-list -n 1 "${GITHUB_REF}")"
          echo "Tag points to: $TAG_SHA"

          if git merge-base --is-ancestor "$TAG_SHA" "origin/main"; then
            echo "OK: tag commit is contained in origin/main"
          else
            echo "ERROR: tag commit is NOT contained in origin/main"
            exit 1
          fi

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Install AWS Copilot
        run: |
          curl -Lo copilot-cli https://github.com/aws/copilot-cli/releases/latest/download/copilot-linux
          chmod +x copilot-cli
          mkdir -p ~/.local/bin
          mv copilot-cli ~/.local/bin/copilot
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          copilot --version

      - name: Deploy (prod)
        run: copilot svc deploy --name api --env prod
