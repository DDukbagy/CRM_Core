[tool.poetry]
name = "crm_backend"
version = "0.1.0"
description = ""
authors = ["you <you@example.com>"]
package-mode = false


[tool.poetry.dependencies]
python = "^3.11"

fastapi = "^0.110.0"
uvicorn = {extras = ["standard"], version = "^0.40.0"}

sqlmodel = "^0.0.16"
sqlalchemy = "^2.0.29"
asyncpg = "^0.31.0"
sqlalchemy-utc = "^0.14.0"

pydantic-settings = "^2.2.1"

email-validator = "^2.3.0"
python-jose = "^3.5.0"
requests = "^2.32.5"
certifi = "^2025.11.12"
alembic = "^1.17.2"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"


[dependency-groups]
dev = [
    "ruff (>=0.14.10,<0.15.0)",
    "pytest (>=9.0.2,<10.0.0)",
    "pytest-asyncio (>=1.3.0,<2.0.0)",
    "httpx (>=0.28.1,<0.29.0)"
]
